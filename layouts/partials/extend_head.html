   Jalan sinkron di <head> sebelum browser memilih favicon. */

    for (var i = 0; i < links.length; i++) links[i].remove();

<script>
/* 3-state theme: light → dark → glass (override toggle 2-state bawaan PaperMod).
   Rollback: hapus blok script ini + assets/css/extended/glass.css */
(function () {
    // 1. Terapkan "glass" sedini mungkin supaya tidak kedip
    try {
        if (localStorage.getItem("pref-theme") === "glass") {
            var applyEarly = function () {
                if (document.body) {
                    document.body.classList.remove("dark");
                    document.body.classList.add("glass");
                } else { requestAnimationFrame(applyEarly); }
            };
            applyEarly();
        }
    } catch (e) {}

    // 2. Ganti toggle bawaan jadi 3-state setelah DOM siap
    document.addEventListener("DOMContentLoaded", function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) return;
        var fresh = btn.cloneNode(true); // buang listener 2-state bawaan PaperMod
        btn.parentNode.replaceChild(fresh, btn);
        var order = ["light", "dark", "glass"];
        function current() {
            if (document.body.classList.contains("glass")) return "glass";
            if (document.body.classList.contains("dark")) return "dark";
            return "light";
        }
        function apply(t) {
            document.body.classList.remove("dark", "glass");
            if (t !== "light") document.body.classList.add(t);
            try { localStorage.setItem("pref-theme", t); } catch (e) {}
            fresh.setAttribute("title", "Tema: " + t + " — klik untuk ganti (Alt+T)");
        }
        fresh.addEventListener("click", function () {
            apply(order[(order.indexOf(current()) + 1) % order.length]);
        });
        var saved = null;
        try { saved = localStorage.getItem("pref-theme"); } catch (e) {}
        if (saved && order.indexOf(saved) >= 0 && saved !== current()) apply(saved);
    });
})();
</script>
